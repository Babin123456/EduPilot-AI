[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edupilot-backend"
version = "1.0.0"
description = "EduPilot AI — Backend API for AI Academic Operating System"
requires-python = ">=3.11"
dependencies = [
    # ---- Web Framework ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    
    # ---- Database ----
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    
    # ---- Auth & Security ----
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    
    # ---- Validation ----
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    
    # ---- AI / LLM ----
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",
    "langchain>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-google-genai>=1.0.0",
    
    # ---- Document Generation ----
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.0",
    
    # ---- Email ----
    "aiosmtplib>=3.0.0",
    
    # ---- Utilities ----
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "Pillow>=10.4.0",
    
    # ---- Logging ----
    "structlog>=24.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
